services:
  whisper-asr:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-for-subs
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Persist Whisper models
      - whisper-models:/root/.cache/huggingface
      # Persist Silero VAD models
      - torch-hub:/root/.cache/torch/hub
      # Upload and output directories
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # Docs for static file serving
      - ./docs:/app/docs
      # User credentials (never committed to git)
      - ./.users:/app/.users:ro
    environment:
      # GPU 0-1 reserved for Whisper parallel transcription.
      # GPU 2-3 reserved for vLLM (when ENABLE_LLM=true).
      - CUDA_VISIBLE_DEVICES=0,1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # Model settings (can be overridden)
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      # LLM settings
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - VLLM_HOST=http://vllm:8000
      - VLLM_MODEL=${VLLM_MODEL:-google/gemma-4-26B-A4B-it}
      # Private model IDs (set in .env, never committed)
      - HAKKA_V2_MODEL=${HAKKA_V2_MODEL:-}
      - HAKKA_V3_MODEL=${HAKKA_V3_MODEL:-}
      - TAIGI_MODEL=${TAIGI_MODEL:-}
    depends_on:
      vllm:
        condition: service_started
        required: false   # App still starts normally if vLLM is not deployed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '16gb'

  vllm:
    # Gemma 4 requires the dedicated vllm/vllm-openai:gemma4 image tag for day-0 support.
    # vLLM loads the model at startup; VLLM_TENSOR_PARALLEL_SIZE shards it across GPUs.
    # 32768 is the recommended --max-model-len for 2x RTX 2080 Ti (22GB total VRAM).
    image: vllm/vllm-openai:gemma4
    container_name: whisper-vllm
    restart: unless-stopped
    profiles:
      - llm   # Only deployed when: docker compose --profile llm up
    ports:
      - "8000:8000"
    volumes:
      # Cache HuggingFace model weights — reused across container restarts
      - vllm-models:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: >
      --model ${VLLM_MODEL:-google/gemma-4-26B-A4B-it}
      --dtype float16
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-2}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3']   # GPU 2+3 for vLLM
              capabilities: [gpu]
    shm_size: '16gb'

volumes:
  whisper-models:
  torch-hub:
  vllm-models:
