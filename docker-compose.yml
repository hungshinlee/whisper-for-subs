services:
  whisper-asr:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-for-subs
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      # Persist Whisper models
      - whisper-models:/root/.cache/huggingface
      # Persist Silero VAD models
      - torch-hub:/root/.cache/torch/hub
      # Upload and output directories
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      # Docs for static file serving
      - ./docs:/app/docs
    environment:
      # GPU 0-1 reserved for Whisper parallel transcription.
      # GPU 2-3 reserved for Ollama LLM (when ENABLE_LLM=true).
      - CUDA_VISIBLE_DEVICES=0,1
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      # Model settings (can be overridden)
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      # LLM settings
      - ENABLE_LLM=${ENABLE_LLM:-false}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      ollama:
        condition: service_started
        required: false   # App still starts normally if Ollama is not deployed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '16gb'

  ollama:
    image: ollama/ollama:latest
    container_name: whisper-ollama
    restart: unless-stopped
    profiles:
      - llm   # Only deployed when: docker compose --profile llm up
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2', '3']   # GPU 2+3 for LLM (27b needs ~18GB VRAM)
              capabilities: [gpu]

volumes:
  whisper-models:
  torch-hub:
  ollama-models:
